<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a12">
<title>Preguntados Argentina</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#06130d,#102b1d 55%,#06110c);color:#fff;min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 18px 30px}
.logo{font-weight:900;letter-spacing:2px;color:#d8ff3e;text-align:center;font-size:24px}
.subtitle{text-align:center;color:#b9c8c0;margin:4px 0 22px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(216,255,62,.22);border-radius:24px;padding:22px;box-shadow:0 15px 50px #0008}
h1{font-size:34px;line-height:1.05;margin:6px 0 12px;text-align:center}
h2{font-size:22px;margin:8px 0 18px}
button{width:100%;border:0;border-radius:15px;padding:15px;margin:7px 0;font-size:16px;font-weight:800;cursor:pointer}
.level{background:#d8ff3e;color:#09120d} .medium{background:#f4c84a;color:#151007} .hard{background:#ff6672;color:#21070a}
.answer{background:#fff;color:#132018;text-align:left} .answer.correct{background:#55e39a} .answer.wrong{background:#ff7780}
.small{color:#aebcb5;font-size:13px;text-align:center}
.top{display:flex;justify-content:space-between;color:#d8ff3e;font-weight:800;margin-bottom:14px}
.progress{height:7px;background:#ffffff18;border-radius:9px;overflow:hidden;margin-bottom:20px} .bar{height:100%;background:#d8ff3e;width:0}
.hidden{display:none} .result{text-align:center} .score{font-size:56px;font-weight:900;color:#d8ff3e}
</style></head>
<body><main class="app">
<div class="logo">🇦🇷 PREGUNTADOS</div><div class="subtitle">ESPECIAL ARGENTINA</div>

<section id="home" class="card">
<h1>¿Cuánto sabés de Argentina?</h1>
<p class="small">Elegí un nivel y respondé 10 preguntas. Las preguntas aparecen en orden aleatorio.</p>
<button class="level" onclick="start('fácil')">🟢 NIVEL FÁCIL</button>
<button class="medium" onclick="start('medio')">🟡 NIVEL MEDIO</button>
<button class="hard" onclick="start('difícil')">🔴 NIVEL DIFÍCIL</button>
</section>

<section id="game" class="card hidden">
<div class="top"><span id="level"></span><span id="counter"></span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2><div id="answers"></div>
<p class="small" id="feedback"></p>
</section>

<section id="result" class="card hidden result">
<h1>🏆 Resultado</h1><div class="score" id="score"></div>
<p id="resultText"></p>
<button class="level" onclick="location.reload()">JUGAR DE NUEVO</button>
</section>
</main>
<script>
const allQuestions = [{"nivel": "fácil", "pregunta": "¿Cuál es la capital de Argentina?", "opciones": ["Córdoba", "Buenos Aires", "Rosario", "Mendoza"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿Cuántos colores tiene la bandera argentina?", "opciones": ["2", "3", "4", "5"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿Cuál es la bebida preparada tradicionalmente con yerba mate?", "opciones": ["Café", "Mate", "Té negro", "Licuado"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿En qué mes se celebra la Revolución de Mayo?", "opciones": ["Mayo", "Julio", "Agosto", "Septiembre"], "correcta": 0}, {"nivel": "fácil", "pregunta": "¿Cuál es la moneda oficial de Argentina?", "opciones": ["Peso argentino", "Real", "Sol", "Euro"], "correcta": 0}, {"nivel": "fácil", "pregunta": "¿Cuál es un baile tradicional argentino?", "opciones": ["Salsa", "Tango", "Samba", "Flamenco"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿Cuál es la montaña más alta de Argentina?", "opciones": ["Cerro Catedral", "Aconcagua", "Lanín", "Fitz Roy"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿Cuántas provincias tiene Argentina?", "opciones": ["21", "23", "25", "27"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿En qué provincia están las Cataratas del Iguazú?", "opciones": ["Corrientes", "Misiones", "Chaco", "Formosa"], "correcta": 1}, {"nivel": "fácil", "pregunta": "¿Cuál es la capital de Tierra del Fuego?", "opciones": ["Río Grande", "Ushuaia", "Tolhuin", "Caleta Olivia"], "correcta": 1}, {"nivel": "medio", "pregunta": "¿En qué provincia se encuentra el Aconcagua?", "opciones": ["San Juan", "Mendoza", "Neuquén", "Salta"], "correcta": 1}, {"nivel": "medio", "pregunta": "¿Quién escribió el Martín Fierro?", "opciones": ["Sarmiento", "José Hernández", "Cortázar", "Lugones"], "correcta": 1}, {"nivel": "medio", "pregunta": "¿En qué año se declaró la Independencia argentina?", "opciones": ["1810", "1812", "1816", "1820"], "correcta": 2}, {"nivel": "medio", "pregunta": "¿Qué prócer es conocido como el Padre de la Patria?", "opciones": ["Belgrano", "San Martín", "Moreno", "Rosas"], "correcta": 1}, {"nivel": "medio", "pregunta": "¿Cuál es la capital de la provincia de San Juan?", "opciones": ["Caucete", "Rawson", "San Juan", "Rivadavia"], "correcta": 2}, {"nivel": "medio", "pregunta": "¿Qué científico argentino recibió dos Premios Nobel?", "opciones": ["Bernardo Houssay", "René Favaloro", "César Milstein", "Leloir"], "correcta": 0}, {"nivel": "medio", "pregunta": "¿Cuál es la provincia más austral de la Argentina continental?", "opciones": ["Santa Cruz", "Chubut", "Tierra del Fuego", "Río Negro"], "correcta": 2}, {"nivel": "medio", "pregunta": "¿Qué río es uno de los principales de la cuenca del Plata?", "opciones": ["Río Colorado", "Río Paraná", "Río Negro", "Río Limay"], "correcta": 1}, {"nivel": "medio", "pregunta": "¿Quién fue conocido por impulsar la educación pública argentina en el siglo XIX?", "opciones": ["Sarmiento", "Roca", "Yrigoyen", "Rosas"], "correcta": 0}, {"nivel": "medio", "pregunta": "¿En qué provincia está el Parque Nacional El Leoncito?", "opciones": ["Mendoza", "San Juan", "La Rioja", "Catamarca"], "correcta": 1}, {"nivel": "difícil", "pregunta": "¿En qué año se sancionó la Constitución Nacional Argentina?", "opciones": ["1816", "1853", "1862", "1880"], "correcta": 1}, {"nivel": "difícil", "pregunta": "¿Quién fue el primer presidente constitucional de la Confederación Argentina?", "opciones": ["Bartolomé Mitre", "Justo José de Urquiza", "Sarmiento", "Julio A. Roca"], "correcta": 1}, {"nivel": "difícil", "pregunta": "¿Cuál es el punto más bajo de Argentina?", "opciones": ["Laguna del Carbón", "Salinas Grandes", "Valle de la Luna", "Bajo de Véliz"], "correcta": 0}, {"nivel": "difícil", "pregunta": "¿En qué provincia se encuentra el Parque Nacional Talampaya?", "opciones": ["Catamarca", "La Rioja", "San Juan", "Mendoza"], "correcta": 1}, {"nivel": "difícil", "pregunta": "¿Qué científico argentino desarrolló la técnica de bypass coronario que lleva su nombre?", "opciones": ["René Favaloro", "Bernardo Houssay", "César Milstein", "Leloir"], "correcta": 0}, {"nivel": "difícil", "pregunta": "¿Qué batalla fue decisiva para la independencia de Chile dentro de la campaña de San Martín?", "opciones": ["Caseros", "Maipú", "Pavón", "Cepeda"], "correcta": 1}, {"nivel": "difícil", "pregunta": "¿Cuál de estos parques nacionales está en San Juan?", "opciones": ["El Leoncito", "Los Glaciares", "Nahuel Huapi", "Iguazú"], "correcta": 0}, {"nivel": "difícil", "pregunta": "¿Quién fue el primer argentino en recibir un Premio Nobel?", "opciones": ["Bernardo Houssay", "Carlos Saavedra Lamas", "Leloir", "Pérez Esquivel"], "correcta": 0}, {"nivel": "difícil", "pregunta": "¿Qué ley estableció la educación primaria común, gratuita y obligatoria?", "opciones": ["Ley 1420", "Ley Sáenz Peña", "Ley de Residencia", "Ley de Aduanas"], "correcta": 0}, {"nivel": "difícil", "pregunta": "¿Qué prócer argentino nació en Yapeyú?", "opciones": ["Manuel Belgrano", "José de San Martín", "Sarmiento", "Guillermo Brown"], "correcta": 1}];
let pool=[], index=0, score=0, locked=false;

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(level){
  pool=shuffle(allQuestions.filter(x=>x.nivel===level)).slice(0,10);
  index=0; score=0;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('level').textContent=level.toUpperCase();
  render();
}
function render(){
  locked=false;
  const q=pool[index];
  document.getElementById('counter').textContent=(index+1)+' / '+pool.length;
  document.getElementById('bar').style.width=((index)/pool.length*100)+'%';
  document.getElementById('question').textContent=q.pregunta;
  document.getElementById('feedback').textContent='';
  const box=document.getElementById('answers'); box.innerHTML='';
  shuffle(q.opciones.map((text,i)=>({text,i}))).forEach(a=>{
    const b=document.createElement('button'); b.className='answer'; b.textContent=a.text;
    b.onclick=()=>answer(a.i,b); box.appendChild(b);
  });
}
function answer(i,btn){
 if(locked)return; locked=true;
 const q=pool[index];
 document.querySelectorAll('.answer').forEach(b=>b.disabled=true);
 if(i===q.correcta){score++;btn.classList.add('correct');document.getElementById('feedback').textContent='✅ ¡Correcto!';}
 else{btn.classList.add('wrong');document.getElementById('feedback').textContent='❌ Incorrecto. La respuesta era: '+q.opciones[q.correcta];}
 setTimeout(()=>{index++; if(index<pool.length)render(); else finish();},900);
}
function finish(){
 document.getElementById('game').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('score').textContent=score+' / '+pool.length;
 document.getElementById('resultText').textContent=score>=9?'¡Excelente! 🇦🇷':score>=7?'¡Muy bien! 🔥':score>=5?'Buen trabajo. 💪':'¡A seguir jugando y aprendiendo! 🚀';
}
</script></body></html>
