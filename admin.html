<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Preguntados Argentina</title><style>*{box-sizing:border-box}body{margin:0;background:#07130e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#10251a;border:1px solid #d8ff3e33;border-radius:20px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#07130e;color:#fff;font-size:15px}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;margin:4px}.primary{background:#d8ff3e;color:#07130e}.danger{background:#ff6672;color:#22070a}.muted{background:#ffffff12;color:#fff}.q{border:1px solid #ffffff18;border-radius:14px;padding:14px;margin:10px 0}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:4px 9px;border-radius:999px;background:#ffffff12;color:#d8ff3e;font-size:12px}.small{color:#aebcb5;font-size:13px}.hidden{display:none}.answer{display:grid;grid-template-columns:1fr 90px;gap:8px;margin:6px 0}.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}h1{margin:0 0 8px}.ok{color:#55e39a}.err{color:#ff7780}</style></head><body><div class="wrap"><h1>🛠️ Administrador · Preguntados Argentina</h1><p class="small">Las preguntas se guardan en <b>questions_public</b>. Los jugadores solo pueden leerlas.</p><section id="login" class="card"><h2>Acceso administrador</h2><div class="grid"><input id="email" type="email" placeholder="Email administrador"><input id="password" type="password" placeholder="Contraseña"></div><button id="loginBtn" class="primary">INGRESAR</button><p id="loginMsg" class="small"></p></section><section id="app" class="hidden"><div class="card"><div class="toolbar"><button id="seedBtn" class="primary">⚡ CARGAR LAS 30 PREGUNTAS INICIALES</button><button id="logoutBtn" class="muted">SALIR</button></div><p id="msg" class="small"></p></div><div class="card"><div class="toolbar"><select id="filter"><option value="todos">Todos</option><option value="fácil">Fácil</option><option value="medio">Medio</option><option value="difícil">Difícil</option></select><button id="refreshBtn" class="muted">↻ Actualizar</button></div><div id="list"></div></div></section></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyDStVY2-PEgM5nezY9BLMxXlfl8pgXgCaM",authDomain:"preguntados-argentina.firebaseapp.com",projectId:"preguntados-argentina",storageBucket:"preguntados-argentina.firebasestorage.app",messagingSenderId:"381499526265",appId:"1:381499526265:web:a3728473d8644aee63d8a8"};const appFb=initializeApp(firebaseConfig),auth=getAuth(appFb),db=getFirestore(appFb);let current=[];const $=id=>document.getElementById(id);function msg(t,ok=true){$("msg").textContent=t;$("msg").className=ok?"small ok":"small err"}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"}[m]))}function normalize(q){return{nivel:q.nivel,pregunta:q.pregunta,opciones:q.opciones,correcta:Number(q.correcta),activo:q.activo!==false,orden:Number(q.orden||0)}}async function load(){const snap=await getDocs(collection(db,"questions_public"));current=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.orden||0)-(b.orden||0));render()}function render(){const f=$("filter").value;const arr=f==="todos"?current:current.filter(q=>q.nivel===f);$("list").innerHTML=arr.map(q=>`<div class="q" data-id="${esc(q.id)}"><div class="qhead"><span class="pill">${esc(q.nivel)} · #${q.orden||""}</span><label class="small"><input class="active" type="checkbox" ${q.activo!==false?"checked":""}> activa</label></div><p><b>Pregunta</b></p><textarea class="question">${esc(q.pregunta)}</textarea><div class="answer">${q.opciones.map((o,i)=>`<input class="opt" value="${esc(o)}"><label class="small"><input class="correct" type="radio" name="c_${esc(q.id)}" ${Number(q.correcta)===i?"checked":""}> correcta</label>`).join("")}</div><div class="toolbar"><select class="level"><option ${q.nivel==="fácil"?"selected":""}>fácil</option><option ${q.nivel==="medio"?"selected":""}>medio</option><option ${q.nivel==="difícil"?"selected":""}>difícil</option></select><input class="order" type="number" value="${q.orden||0}" style="max-width:100px"><button class="save primary">Guardar</button><button class="del danger">Eliminar</button></div></div>`).join("")||'<p class="small">No hay preguntas.</p>';document.querySelectorAll(".save").forEach(b=>b.onclick=saveOne);document.querySelectorAll(".del").forEach(b=>b.onclick=delOne)}async function saveOne(e){const el=e.target.closest(".q"),id=el.dataset.id;const opts=[...el.querySelectorAll(".opt")].map(x=>x.value.trim());const correct=[...el.querySelectorAll(".correct")].findIndex(x=>x.checked);if(!el.querySelector(".question").value.trim()||opts.some(x=>!x)||correct<0){msg("Completá la pregunta, las 4 opciones y la correcta.",false);return}await setDoc(doc(db,"questions_public",id),{nivel:el.querySelector(".level").value,pregunta:el.querySelector(".question").value.trim(),opciones:opts,correcta:correct,activo:el.querySelector(".active").checked,orden:Number(el.querySelector(".order").value)||0},{merge:true});msg("Pregunta guardada.");await load()}async function delOne(e){const id=e.target.closest(".q").dataset.id;if(!confirm("¿Eliminar esta pregunta?"))return;await deleteDoc(doc(db,"questions_public",id));msg("Pregunta eliminada.");await load()}async function seed(){const seed=await fetch("preguntas_seed.json").then(r=>r.json());let n=0;for(const q of seed){await setDoc(doc(db,"questions_public",q.id),q,{merge:true});n++}msg(`Se cargaron/actualizaron ${n} preguntas.`);await load()}function newQuestion(){const id="q_"+Date.now();current.unshift({id,nivel:"fácil",pregunta:"Nueva pregunta",opciones:["Opción 1","Opción 2","Opción 3","Opción 4"],correcta:0,activo:true,orden:999});render();setTimeout(()=>{document.querySelector(`[data-id="${id}"]`)?.scrollIntoView()},50);/* create blank through save only */}$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(e){$("loginMsg").textContent="No se pudo ingresar. Verificá email, contraseña y que Email/Password esté habilitado."}};$("logoutBtn").onclick=()=>signOut(auth);$("seedBtn").onclick=()=>seed().catch(e=>msg("No se pudieron cargar las preguntas: "+e.message,false));$("refreshBtn").onclick=()=>load().catch(e=>msg(e.message,false));$("filter").onchange=render;onAuthStateChanged(auth,u=>{if(u){$("login").classList.add("hidden");$("app").classList.remove("hidden");load().catch(e=>msg("No se pudo leer questions_public: "+e.message,false))}else{$("login").classList.remove("hidden");$("app").classList.add("hidden")}});</script></body></html>
