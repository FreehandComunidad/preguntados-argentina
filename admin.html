<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador · Preguntados Argentina</title><script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=88RkgxNPT5eOhhwd2NYuXiAQabKIkeaBigJWbtJtPxIBUjj6Tddi-tRIDl5CD9nAO1TsJhoLhz2teTiauvctvSIgO5R0rz7DXnVUH109O_MNwzZ4o-_KFQwD8Wn41Xs9XkTibd55DSC5bbVL8sTEesZCOGGyH-_oGVjDfeOhA-i2TDbRzs0MvQix-AgGMDbHkuetKzop2KhN_s3pEr86Y_vCvcTT0rbhrCoDGHM8tZYnT7Dx6vSqNHxi1PQKEFdCJJwxcwa2qLLYUw5YSerGXqlhAEld9j4CqNJlkK0St7Xh-sHEayDpDPyvJ5jeK89u" charset="UTF-8"></script><style>
*{box-sizing:border-box}:root{--lime:#d8ff3e;--green:#19ff72;--gold:#ffd34d;--muted:#aebcb5;--red:#ff6672}html,body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(38,255,112,.15),transparent 32%),linear-gradient(135deg,#030605,#08130d 50%,#030605);color:#f7fff9;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 18px 50px}h1{margin:0 0 7px;font-size:32px}.subtitle{color:var(--muted);margin:0}.card{background:linear-gradient(145deg,rgba(17,44,28,.97),rgba(5,15,10,.98));border:1px solid rgba(196,255,50,.25);border-radius:20px;padding:18px;margin:15px 0;box-shadow:0 16px 45px #0006}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--lime);color:#07130e}.secondary{background:#ffffff12;color:#fff;border:1px solid #ffffff12}.danger{background:var(--red);color:#26080b}.gold{background:var(--gold);color:#241b00}input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #ffffff1c;background:#06110b;color:#fff;font-size:15px;outline:none}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#d8ff3e88;box-shadow:0 0 0 2px #d8ff3e14}.controls{display:grid;grid-template-columns:180px 1fr 180px;gap:10px}@media(max-width:800px){.controls{grid-template-columns:1fr}}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stat{background:#ffffff0a;border:1px solid #ffffff12;border-radius:12px;padding:9px 13px}.stat b{color:var(--lime)}.msg{min-height:20px;margin:10px 0 0;color:var(--green);font-weight:700}.err{color:#ff8b93}.q{border:1px solid #ffffff16;border-radius:16px;padding:16px;margin:12px 0;background:#07150d}.qhead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#ffffff0e;color:var(--lime);font-size:12px;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid2{grid-template-columns:1fr}}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.options{grid-template-columns:1fr}}.option{display:grid;grid-template-columns:1fr 115px;gap:7px;align-items:center;margin-top:7px}.option label{color:var(--muted);font-size:13px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.meta select{width:150px}.meta input{width:110px}.active{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}.active input{width:auto}.empty{padding:30px;text-align:center;color:var(--muted)}.hidden{display:none}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
</style></head><body><div class="wrap"><div class="topline"><div><h1>🛠️ Administrador · Preguntados Argentina</h1><p class="subtitle">Firebase es la fuente única de preguntas del juego.</p></div><button id="logoutBtn" class="secondary hidden">SALIR</button></div><section id="login" class="card"><h2>Acceso administrador</h2><div class="grid2"><input id="email" type="email" placeholder="Email administrador"><input id="password" type="password" placeholder="Contraseña"></div><button id="loginBtn" class="primary" style="margin-top:10px">INGRESAR</button><div id="loginMsg" class="msg"></div></section><section id="app" class="hidden"><div class="card"><div class="toolbar"><button id="newBtn" class="primary">＋ NUEVA PREGUNTA</button><button id="restoreBtn" class="gold">↺ RESTAURAR 30 INICIALES</button><button id="refreshBtn" class="secondary">⟳ ACTUALIZAR</button></div><div id="msg" class="msg"></div><div class="stats"><div class="stat">Total: <b id="countAll">0</b></div><div class="stat">Activas: <b id="countActive">0</b></div><div class="stat">Fácil: <b id="countEasy">0</b></div><div class="stat">Medio: <b id="countMedium">0</b></div><div class="stat">Difícil: <b id="countHard">0</b></div></div></div><div class="card"><div class="controls"><select id="filter"><option value="todos">Todos los niveles</option><option value="fácil">Fácil</option><option value="medio">Medio</option><option value="difícil">Difícil</option></select><input id="search" placeholder="Buscar pregunta u opción..."><select id="activeFilter"><option value="todas">Activas y desactivadas</option><option value="activas">Solo activas</option><option value="inactivas">Solo desactivadas</option></select></div></div><div id="list"></div></section></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,deleteDoc,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const firebaseConfig={"apiKey": "AIzaSyDStVY2-PEgM5nezY9BLMxXlfl8pgXgCaM", "authDomain": "preguntados-argentina.firebaseapp.com", "projectId": "preguntados-argentina", "storageBucket": "preguntados-argentina.firebasestorage.app", "messagingSenderId": "381499526265", "appId": "1:381499526265:web:a3728473d8644aee63d8a8"};
const appFb=initializeApp(firebaseConfig),auth=getAuth(appFb),db=getFirestore(appFb),BANK="questions_public";const $=id=>document.getElementById(id);let current=[];
const INITIAL_QUESTIONS=[{"nivel":"fácil","pregunta":"¿Cuál es la capital de Argentina?","opciones":["Córdoba","Buenos Aires","Rosario","Mendoza"],"correcta":1,"id":"q_001","activo":true,"orden":1},{"nivel":"fácil","pregunta":"¿Cuántos colores tiene la bandera argentina?","opciones":["2","3","4","5"],"correcta":1,"id":"q_002","activo":true,"orden":2},{"nivel":"fácil","pregunta":"¿Cuál es la bebida preparada tradicionalmente con yerba mate?","opciones":["Café","Mate","Té negro","Licuado"],"correcta":1,"id":"q_003","activo":true,"orden":3},{"nivel":"fácil","pregunta":"¿En qué mes se celebra la Revolución de Mayo?","opciones":["Mayo","Julio","Agosto","Septiembre"],"correcta":0,"id":"q_004","activo":true,"orden":4},{"nivel":"fácil","pregunta":"¿Cuál es la moneda oficial de Argentina?","opciones":["Peso argentino","Real","Sol","Euro"],"correcta":0,"id":"q_005","activo":true,"orden":5},{"nivel":"fácil","pregunta":"¿Cuál es un baile tradicional argentino?","opciones":["Salsa","Tango","Samba","Flamenco"],"correcta":1,"id":"q_006","activo":true,"orden":6},{"nivel":"fácil","pregunta":"¿Cuál es la montaña más alta de Argentina?","opciones":["Cerro Catedral","Aconcagua","Lanín","Fitz Roy"],"correcta":1,"id":"q_007","activo":true,"orden":7},{"nivel":"fácil","pregunta":"¿Cuántas provincias tiene Argentina?","opciones":["21","23","25","27"],"correcta":1,"id":"q_008","activo":true,"orden":8},{"nivel":"fácil","pregunta":"¿En qué provincia están las Cataratas del Iguazú?","opciones":["Corrientes","Misiones","Chaco","Formosa"],"correcta":1,"id":"q_009","activo":true,"orden":9},{"nivel":"fácil","pregunta":"¿Cuál es la capital de Tierra del Fuego?","opciones":["Río Grande","Ushuaia","Tolhuin","Caleta Olivia"],"correcta":1,"id":"q_010","activo":true,"orden":10},{"nivel":"medio","pregunta":"¿En qué provincia se encuentra el Aconcagua?","opciones":["San Juan","Mendoza","Neuquén","Salta"],"correcta":1,"id":"q_011","activo":true,"orden":11},{"nivel":"medio","pregunta":"¿Quién escribió el Martín Fierro?","opciones":["Sarmiento","José Hernández","Cortázar","Lugones"],"correcta":1,"id":"q_012","activo":true,"orden":12},{"nivel":"medio","pregunta":"¿En qué año se declaró la Independencia argentina?","opciones":["1810","1812","1816","1820"],"correcta":2,"id":"q_013","activo":true,"orden":13},{"nivel":"medio","pregunta":"¿Qué prócer es conocido como el Padre de la Patria?","opciones":["Belgrano","San Martín","Moreno","Rosas"],"correcta":1,"id":"q_014","activo":true,"orden":14},{"nivel":"medio","pregunta":"¿Cuál es la capital de la provincia de San Juan?","opciones":["Caucete","Rawson","San Juan","Rivadavia"],"correcta":2,"id":"q_015","activo":true,"orden":15},{"nivel":"medio","pregunta":"¿Qué científico argentino recibió dos Premios Nobel?","opciones":["Bernardo Houssay","René Favaloro","César Milstein","Leloir"],"correcta":0,"id":"q_016","activo":true,"orden":16},{"nivel":"medio","pregunta":"¿Cuál es la provincia más austral de la Argentina continental?","opciones":["Santa Cruz","Chubut","Tierra del Fuego","Río Negro"],"correcta":2,"id":"q_017","activo":true,"orden":17},{"nivel":"medio","pregunta":"¿Qué río es uno de los principales de la cuenca del Plata?","opciones":["Río Colorado","Río Paraná","Río Negro","Río Limay"],"correcta":1,"id":"q_018","activo":true,"orden":18},{"nivel":"medio","pregunta":"¿Quién fue conocido por impulsar la educación pública argentina en el siglo XIX?","opciones":["Sarmiento","Roca","Yrigoyen","Rosas"],"correcta":0,"id":"q_019","activo":true,"orden":19},{"nivel":"medio","pregunta":"¿En qué provincia está el Parque Nacional El Leoncito?","opciones":["Mendoza","San Juan","La Rioja","Catamarca"],"correcta":1,"id":"q_020","activo":true,"orden":20},{"nivel":"difícil","pregunta":"¿En qué año se sancionó la Constitución Nacional Argentina?","opciones":["1816","1853","1862","1880"],"correcta":1,"id":"q_021","activo":true,"orden":21},{"nivel":"difícil","pregunta":"¿Quién fue el primer presidente constitucional de la Confederación Argentina?","opciones":["Bartolomé Mitre","Justo José de Urquiza","Sarmiento","Julio A. Roca"],"correcta":1,"id":"q_022","activo":true,"orden":22},{"nivel":"difícil","pregunta":"¿Cuál es el punto más bajo de Argentina?","opciones":["Laguna del Carbón","Salinas Grandes","Valle de la Luna","Bajo de Véliz"],"correcta":0,"id":"q_023","activo":true,"orden":23},{"nivel":"difícil","pregunta":"¿En qué provincia se encuentra el Parque Nacional Talampaya?","opciones":["Catamarca","La Rioja","San Juan","Mendoza"],"correcta":1,"id":"q_024","activo":true,"orden":24},{"nivel":"difícil","pregunta":"¿Qué científico argentino desarrolló la técnica de bypass coronario que lleva su nombre?","opciones":["René Favaloro","Bernardo Houssay","César Milstein","Leloir"],"correcta":0,"id":"q_025","activo":true,"orden":25},{"nivel":"difícil","pregunta":"¿Qué batalla fue decisiva para la independencia de Chile dentro de la campaña de San Martín?","opciones":["Caseros","Maipú","Pavón","Cepeda"],"correcta":1,"id":"q_026","activo":true,"orden":26},{"nivel":"difícil","pregunta":"¿Cuál de estos parques nacionales está en San Juan?","opciones":["El Leoncito","Los Glaciares","Nahuel Huapi","Iguazú"],"correcta":0,"id":"q_027","activo":true,"orden":27},{"nivel":"difícil","pregunta":"¿Quién fue el primer argentino en recibir un Premio Nobel?","opciones":["Bernardo Houssay","Carlos Saavedra Lamas","Leloir","Pérez Esquivel"],"correcta":0,"id":"q_028","activo":true,"orden":28},{"nivel":"difícil","pregunta":"¿Qué ley estableció la educación primaria común, gratuita y obligatoria?","opciones":["Ley 1420","Ley Sáenz Peña","Ley de Residencia","Ley de Aduanas"],"correcta":0,"id":"q_029","activo":true,"orden":29},{"nivel":"difícil","pregunta":"¿Qué prócer argentino nació en Yapeyú?","opciones":["Manuel Belgrano","José de San Martín","Sarmiento","Guillermo Brown"],"correcta":1,"id":"q_030","activo":true,"orden":30}];
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function msg(t,ok=true){$("msg").textContent=t;$("msg").className="msg"+(ok?"":" err")}
function loginMsg(t){$("loginMsg").textContent=t;$("loginMsg").className="msg err"}
async function load(){const snap=await getDocs(collection(db,BANK));current=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(Number(a.orden)||0)-(Number(b.orden)||0));updateStats();render()}
function updateStats(){const active=current.filter(q=>q.activo===true);$("countAll").textContent=current.length;$("countActive").textContent=active.length;$("countEasy").textContent=active.filter(q=>q.nivel==="fácil").length;$("countMedium").textContent=active.filter(q=>q.nivel==="medio").length;$("countHard").textContent=active.filter(q=>q.nivel==="difícil").length}
function render(){const f=$("filter").value,s=$("search").value.trim().toLowerCase(),af=$("activeFilter").value;let arr=current.filter(q=>(f==="todos"||q.nivel===f)&&(af==="todas"||(af==="activas"?q.activo===true:q.activo!==true)));if(s)arr=arr.filter(q=>[q.pregunta,...(q.opciones||[])].join(" ").toLowerCase().includes(s));$("list").innerHTML=arr.map(card).join("")||'<div class="card empty">No hay preguntas que coincidan.</div>';document.querySelectorAll('.save').forEach(b=>b.onclick=saveOne);document.querySelectorAll('.del').forEach(b=>b.onclick=delOne)}
function card(q){const opts=Array.isArray(q.opciones)?q.opciones:["","","",""];return `<div class="q" data-id="${esc(q.id)}"><div class="qhead"><span class="pill">${esc(q.nivel||"fácil")} · #${Number(q.orden)||0}</span><label class="active"><input class="activeBox" type="checkbox" ${q.activo===true?"checked":""}> activa</label></div><p><b>Pregunta</b></p><textarea class="question">${esc(q.pregunta||"")}</textarea><div class="options">${opts.map((o,i)=>`<div class="option"><input class="opt" value="${esc(o)}"><label><input class="correct" type="radio" name="c_${esc(q.id)}" ${Number(q.correcta)===i?"checked":""}> correcta</label></div>`).join("")}</div><div class="meta"><select class="level"><option ${q.nivel==="fácil"?"selected":""}>fácil</option><option ${q.nivel==="medio"?"selected":""}>medio</option><option ${q.nivel==="difícil"?"selected":""}>difícil</option></select><input class="order" type="number" min="1" value="${Number(q.orden)||1}"><button class="save primary">💾 GUARDAR</button><button class="del danger">ELIMINAR</button></div></div>`}
async function saveOne(e){const el=e.target.closest('.q'),id=el.dataset.id,pregunta=el.querySelector('.question').value.trim(),opciones=[...el.querySelectorAll('.opt')].map(x=>x.value.trim()),correcta=[...el.querySelectorAll('.correct')].findIndex(x=>x.checked),nivel=el.querySelector('.level').value,orden=Math.max(1,Number(el.querySelector('.order').value)||1),activo=el.querySelector('.activeBox').checked;if(!pregunta||opciones.length!==4||opciones.some(x=>!x)||correcta<0){msg('Completá la pregunta, las 4 opciones y la respuesta correcta.',false);return}try{e.target.disabled=true;await setDoc(doc(db,BANK,id),{nivel,pregunta,opciones,correcta,activo,orden,updatedAt:serverTimestamp()},{merge:true});msg('✅ Pregunta guardada en Firebase.');await load()}catch(err){console.error(err);msg('No se pudo guardar: '+err.message,false)}finally{e.target.disabled=false}}
async function delOne(e){const id=e.target.closest('.q').dataset.id;if(!confirm('¿Eliminar definitivamente esta pregunta? Si solo querés que no aparezca en el juego, desmarcá “activa”.'))return;try{await deleteDoc(doc(db,BANK,id));msg('Pregunta eliminada.');await load()}catch(err){msg('No se pudo eliminar: '+err.message,false)}}
function newQuestion(){const id='q_'+Date.now().toString(36),level=$("filter").value==='todos'?'fácil':$("filter").value,max=current.filter(q=>q.nivel===level).reduce((m,q)=>Math.max(m,Number(q.orden)||0),0);current.unshift({id,nivel:level,pregunta:'',opciones:['','','',''],correcta:0,activo:true,orden:max+1});$("filter").value=level;$("activeFilter").value='todas';$("search").value='';render();document.querySelector(`[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})}
async function restoreInitial(){if(!confirm('Esto actualizará las 30 preguntas iniciales en Firebase. No eliminará preguntas adicionales. ¿Continuar?'))return;try{$("restoreBtn").disabled=true;const batch=writeBatch(db);INITIAL_QUESTIONS.forEach(q=>batch.set(doc(db,BANK,q.id),{...q,updatedAt:serverTimestamp()},{merge:true}));await batch.commit();msg('✅ Se restauraron las 30 preguntas iniciales.');await load()}catch(err){console.error(err);msg('No se pudieron restaurar: '+err.message,false)}finally{$("restoreBtn").disabled=false}}
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=''}catch(e){loginMsg('No se pudo ingresar. Verificá email, contraseña y Email/Password en Firebase.')}};
$("logoutBtn").onclick=()=>signOut(auth);$("refreshBtn").onclick=()=>load().catch(e=>msg('No se pudo actualizar: '+e.message,false));$("newBtn").onclick=newQuestion;$("restoreBtn").onclick=restoreInitial;$("filter").onchange=render;$("activeFilter").onchange=render;$("search").oninput=render;
onAuthStateChanged(auth,u=>{if(u){$("login").classList.add('hidden');$("app").classList.remove('hidden');$("logoutBtn").classList.remove('hidden');load().catch(e=>msg('No se pudo leer Firebase: '+e.message,false))}else{$("login").classList.remove('hidden');$("app").classList.add('hidden');$("logoutBtn").classList.add('hidden')}});
</script></body></html>
